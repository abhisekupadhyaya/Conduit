[project]
name = "conduit-backend"
version = "0.0.0"
description = "Conduit — self-contained single-property guest-request orchestrator (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4.0",  # passlib 1.7.4 cannot drive bcrypt>=4 (removed __about__; hard 72-byte raise)
  "boto3>=1.35",          # S3 / MinIO (local S3 alternative)
  "httpx>=0.27",          # OpenAI client transport
  "tenacity>=9.0",        # circuit-breaker / retry around the LLM (AD11)
  "openai>=1.50",         # OpenAI Responses API (responses.parse / text_format)
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "anyio>=4.6",
  "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conduit"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["conduit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=conduit.public --cov=conduit.supervisor --cov=conduit.core --cov=conduit.shared.models --cov-fail-under=90 --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
